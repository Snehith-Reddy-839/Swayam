version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: munchmate-postgres
    environment:
      POSTGRES_USER: munchmate
      POSTGRES_PASSWORD: munchmate_secure_pass_2026
      POSTGRES_DB: munchmate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles: ["postgres"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: munchmate-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./munchmate.db
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - SECRET_KEY=munchmate-docker-secret-key-2026
      - PAYMENT_MODE=demo
      - DEMO_MODE=true
      - UPI_VPA=munchmate@upi
      - UPI_PAYEE_NAME=MunchMate Group Pool
    volumes:
      - backend-data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: munchmate-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  postgres-data:
